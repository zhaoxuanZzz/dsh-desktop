name: build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
  dist-mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm run build:icon
      - run: pnpm run build:main
      - run: pnpm run fetch-node
      - run: pnpm run stage-dsh
      - run: pnpm exec electron-builder --mac --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: saddle-mac-arm64
          path: dist-bundle/*.dmg
  dist-win:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm run build:icon
      - run: pnpm run build:main
      - run: pnpm run fetch-node
      - run: pnpm run stage-dsh
      - run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: saddle-win-x64
          path: dist-bundle/*.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist-mac, dist-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(saddle-mac-arm64/*.dmg saddle-win-x64/*.exe)
          test ${#files[@]} -gt 0
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Saddle ${GITHUB_REF_NAME#v}" \
            --notes "$(cat <<'EOF'
First public release of Saddle, an unofficial desktop app for DeepSeek Harness.

- macOS 13+ Apple Silicon: `.dmg`
- Windows 10+ x64: `.exe`

Builds are unsigned. macOS: right-click → Open. Windows: SmartScreen → More info → Run anyway.

---

Saddle 首个公开版本，DeepSeek Harness 的非官方桌面应用。

- macOS 13+ Apple Silicon：`.dmg`
- Windows 10+ x64：`.exe`

安装包未签名。macOS 右键打开；Windows 在 SmartScreen 选择仍要运行。
EOF
)"
