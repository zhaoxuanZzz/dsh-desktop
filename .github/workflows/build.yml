name: build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm typecheck
  dist-mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm run build:icon
      - run: pnpm run build:main
      - run: pnpm run fetch-node
      - run: pnpm run stage-dsh
      - run: pnpm exec electron-builder --mac --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: saddle-mac-arm64
          path: dist-bundle/*.dmg
  dist-win:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm run build:icon
      - run: pnpm run build:main
      - run: pnpm run fetch-node
      - run: pnpm run stage-dsh
      - run: pnpm exec electron-builder --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: saddle-win-x64
          path: dist-bundle/*.exe
